<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-crops" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062817"/>
      <stop offset="100%" stop-color="#0f3b25"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg-crops)"/>
  <!-- Phone Frame Silhouette -->
  <rect x="210" y="20" width="180" height="320" rx="20" fill="#0b1120" stroke="#1e293b" stroke-width="3"/>
  <rect x="250" y="30" width="100" height="6" rx="3" fill="#1e293b"/>
  <!-- App Header -->
  <text x="300" y="65" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Weather Crops App</text>
  <text x="300" y="80" fill="#4ade80" font-family="sans-serif" font-size="9" text-anchor="middle">Talisay City, Negros Occidental</text>
  <!-- Weather Card -->
  <rect x="225" y="95" width="150" height="75" rx="10" fill="#166534" stroke="#22c55e" stroke-width="0.5"/>
  <text x="240" y="125" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">30°C</text>
  <text x="240" y="145" fill="#bbf7d0" font-family="sans-serif" font-size="10">Mainly Clear • Rain: 0.0mm</text>
  <!-- 7-Day Mini Row -->
  <rect x="225" y="180" width="45" height="55" rx="6" fill="#14532d"/>
  <text x="247" y="200" fill="#ffffff" font-family="sans-serif" font-size="8" text-anchor="middle">Mon</text>
  <text x="247" y="220" fill="#4ade80" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">26°</text>
  <rect x="277" y="180" width="45" height="55" rx="6" fill="#14532d"/>
  <text x="300" y="200" fill="#ffffff" font-family="sans-serif" font-size="8" text-anchor="middle">Tue</text>
  <text x="300" y="220" fill="#4ade80" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">28°</text>
  <rect x="330" y="180" width="45" height="55" rx="6" fill="#14532d"/>
  <text x="352" y="200" fill="#ffffff" font-family="sans-serif" font-size="8" text-anchor="middle">Wed</text>
  <text x="352" y="220" fill="#4ade80" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">29°</text>
  <!-- Soil & Decision Panel -->
  <rect x="225" y="245" width="150" height="70" rx="10" fill="#131d35" stroke="#1e293b"/>
  <text x="240" y="270" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold">Agricultural Insight</text>
  <text x="240" y="290" fill="#94a3b8" font-family="sans-serif" font-size="8">Favorable harvest window.</text>
  <text x="240" y="303" fill="#94a3b8" font-family="sans-serif" font-size="8">Open-Meteo REST Telemetry.</text>
</svg>
